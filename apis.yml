aid: viewpoints-ai
name: Viewpoints AI
description: >-
  Viewpoints AI (viewpoints.ai) is a Stanford-founded research platform that runs
  AI jury simulations for litigation teams and AI audience panels for market
  researchers. Companies upload case materials or creative/marketing stimuli and a
  representative panel of simulated personas reads them, deliberates, and returns
  verdict or response distributions, the themes driving them, and per-participant
  reasoning — same-day, with a claimed 88% match to real studies (Stanford-validated).
  The Viewpoints Study API lets developers programmatically create studies, upload
  stimuli, poll asynchronous creation jobs, retrieve full participant results, and
  schedule recurring runs. SOC 2 Type II. Backed by Forerunner Ventures.
