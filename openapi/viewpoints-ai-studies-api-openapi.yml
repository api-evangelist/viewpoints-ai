          type: array
        status:
          title: Status
          type: string
        study_details:
          $ref: '#/components/schemas/StudyDetailsResponse'
        user_id:
          title: User Id
          type: string
        version:
          default: 0
          title: Version
          type: integer
      required:
      - study_details
      - results
      - created_at
      - status
      - user_id
      title: GetStudyResponse
      type: object
    AssignedMaterialsItem:
      properties:
        materials_name:
          title: Materials Name
          type: string
        stimuli:
          items:
            $ref: '#/components/schemas/StimulusItem'
          title: Stimuli
          type: array
      required:
      - materials_name
      - stimuli
      title: AssignedMaterialsItem
      type: object
    JobStatusResponse:
      properties:
        analyze_done:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Analyze Done
        analyze_item_elapsed_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Analyze Item Elapsed Ms
        analyze_item_expected_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Analyze Item Expected Ms
        analyze_total:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Analyze Total
        analyze_video_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Analyze Video Seconds
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Error Message
        has_analyzing_media:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Has Analyzing Media
        has_enriched_context:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Has Enriched Context
        has_life_stories:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Has Life Stories
        has_media:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Has Media
        has_qualitative_questions:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Has Qualitative Questions
        jury_panel_size:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Jury Panel Size
        media_done:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Media Done
        media_item_elapsed_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Media Item Elapsed Ms
        media_item_expected_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Media Item Expected Ms
        media_total:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Media Total
        number_participants:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Number Participants
        phase:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Phase
        phase_entered_at_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Phase Entered At Ms
        progress:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          title: Progress
        qual_questions_count:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Qual Questions Count
        status:
          enum:
          - processing
          - preparing_context
          - completed
          - failed
          title: Status
          type: string
        study_id:
          anyOf:
          - type: string
